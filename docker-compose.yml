services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marketwire
      POSTGRES_PASSWORD: marketwire
      POSTGRES_DB: marketwire
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketwire"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
